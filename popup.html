<!DOCTYPE html>
<html>
<head>
  <title>Dual Subtitles Settings</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">

    <!-- START: Notice Moved to Top and Button Added -->
    <div id="reloadNotice" class="notice-box" style="display: none;">
      <span>Reload tab to apply changes</span>
      <button id="reloadBtn">Reload</button>
    </div>
    <!-- END: Notice Moved to Top and Button Added -->

    <fieldset>
      <legend>New Languages to Show Subtitles</legend>
      <div id="originalLangs">
        <!-- Main languages will be inserted here -->
        <div id="mainLangsContainer" class="checkbox-grid"></div>
        <hr class="separator">
        <!-- Collapsible section for other languages -->
        <details class="collapsible-section">
            <summary>Other Languages</summary>
            <div id="otherLangsContainer" class="checkbox-grid"></div>
        </details>
      </div>
      <div class="button-group">
        <button id="selectAll">Select All</button>
        <button id="clearAll">Clear All</button>
      </div>
    </fieldset>

    <fieldset>
      <legend>Native Language</legend>
      <!-- Dropdown will be dynamically populated -->
      <select id="targetLang" style="margin-bottom: 10px; width: 100%;"></select>
      
      <!-- ADDED: Show Native Language Checkbox -->
      <div class="option" style="margin-top: 5px;">
        <input type="checkbox" id="showNative" />
        <label for="showNative">Show Native Language Subtitles</label>
      </div>
    </fieldset>

    <fieldset>
      <legend>Options</legend>
      
      <!-- Font Size Slider and Number Input -->
      <div class="option" style="margin-bottom: 10px; display: block;">
        <label for="fontSizeSlider">Caption Font Size:</label>
        <div style="display: flex; align-items: center; gap: 10px; margin-top: 5px;">
          <input type="range" id="fontSizeSlider" min="50" max="300" step="10" value="150" style="flex-grow: 1;" />
          <div style="display: flex; align-items: center;">
            <input type="number" id="fontSizeInput" min="50" max="300" value="150" style="width: 60px; padding: 2px 4px;" />
            <span style="margin-left: 4px;">%</span>
          </div>
        </div>
      </div>

      <div class="option">
        <input type="checkbox" id="autoPlay" />
        <label for="autoPlay">Play after displaying subtitles</label>
      </div>
    </fieldset>

    <fieldset>
        <legend>Actions</legend>
        <button id="removeSubsBtn">Remove Subtitles on Current Video</button>
    </fieldset>

    <fieldset>
      <legend>Status / Errors</legend>
      <div id="errorBox">No errors.</div>
    </fieldset>
  </div>
  <!-- Use type="module" to allow imports -->
  <script src="popup.js" type="module"></script>
</body>
</html>
